    <!-- Page‑only styles -->
    <style>
        /* ---------- Page-only styles (guest invite) ---------- */
        body {
            display: block;
        }
        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .hero {
            text-align: center;
            padding-top: 52px;
            padding-bottom: 8px;
        }
        .hero .type-badge {
            margin-bottom: 18px;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: clamp(32px, 9vw, 50px);
            line-height: 1.08;
            margin: 18px 0 14px;
        }
        .cover {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: var(--radius-lg);
            background-size: cover;
            background-position: center;
            margin-bottom: 24px;
            background-color: var(--bg-card);
        }
        .subline {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 420px;
            margin: 0 auto 28px;
            line-height: 1.6;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 28px 0;
        }
        .bead {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 62px;
            height: 62px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .bead b {
            font-size: 19px;
            font-weight: 800;
        }
        .bead small {
            font-size: 9px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 9px;
            align-items: center;
            margin-bottom: 32px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .details div {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .details i {
            color: var(--accent);
            width: 14px;
        }

        .story {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 26px 0;
            margin-bottom: 32px;
            text-align: center;
        }
        .story p {
            font-size: 14.5px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .rsvp-card {
            padding: 28px 24px;
        }
        .rsvp-card h2 {
            font-size: 19px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .attend-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }
        .attend-toggle button {
            flex: 1;
            padding: 11px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-family: inherit;
            font-size: 13.5px;
            cursor: pointer;
        }
        .attend-toggle button.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        .attend-toggle button.active.no {
            background: var(--danger-soft);
            border-color: var(--danger);
            color: var(--danger);
        }

        .success-state {
            text-align: center;
            padding: 20px 0;
        }
        .success-state i {
            font-size: 34px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .success-state h3 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .success-state p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .badge-footer {
            text-align: center;
            margin-top: 26px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .badge-footer a {
            color: var(--text-secondary);
        }

        .load-state,
        .error-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }
        .error-state i {
            font-size: 30px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ============ LOADING / ERROR STATES ============ -->
    <div id="load-state" class="load-state">
        <i class="fa-solid fa-spinner spin" style="font-size:22px;"></i>
        <p style="margin-top:12px;">Loading invitation…</p>
    </div>

    <div id="error-state" class="error-state hidden">
        <i class="fa-regular fa-face-frown"></i>
        <p>We couldn't find this invitation. Double-check the link with your host.</p>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <div class="wrap hidden" id="content">
        <div class="hero">
            <span class="badge badge-accent type-badge" id="type-badge"></span>
            <h1 id="event-title"></h1>
            <p class="subline" id="event-subline">You're invited — we'd love for you to join.</p>
        </div>

        <div class="cover" id="cover-image"></div>

        <div class="countdown" id="countdown"></div>

        <div class="details" id="details"></div>

        <div class="card story hidden" id="story-block">
            <p id="event-story"></p>
        </div>

        <form class="card rsvp-card" id="rsvp-form">
            <h2>Will you be there?</h2>

            <div class="attend-toggle">
                <button type="button" class="active" id="btn-yes">Joyfully Accept</button>
                <button type="button" id="btn-no">Can't Make It</button>
            </div>

            <div class="field" style="margin-top:16px;">
                <label for="name">Your Full Name</label>
                <input id="name" required placeholder="e.g. Funmi Adeyemi">
            </div>

            <div class="field">
                <label for="phone">Phone / WhatsApp</label>
                <input id="phone" type="tel" placeholder="e.g. 0803 000 0000">
            </div>

            <div class="field">
                <label for="count">Number of Guests (incl. you)</label>
                <input id="count" type="number" min="1" max="10" value="1">
            </div>

            <div class="field">
                <label for="message">A Message for the Host (optional)</label>
                <textarea id="message" rows="3" placeholder="Leave your wishes..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Send RSVP</button>
            <div class="status-msg" id="status-msg"></div>

            <div class="success-state hidden" id="success-state">
                <i class="fa-regular fa-circle-check"></i>
                <h3>You're on the list</h3>
                <p>Your host has been notified. See you there!</p>
            </div>
        </form>

        <p class="badge-footer" id="badge-footer">Made with <a href="https://invites.devtem.org">D Invites</a> — create your own event page</p>
    </div>

    <!-- ============ SCRIPTS ============ -->
    <script src="/assets/js/global.js"></script>
    <script type="module" src="/assets/js/e-slug.js">
    </script>
</body>
</html>

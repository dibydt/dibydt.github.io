<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set a new password — D Invites</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/global.css"><style>body{display:flex;align-items:center;justify-content:center;padding:40px 20px;min-height:100vh}.shell{width:100%;max-width:400px}.brand{text-align:center;margin-bottom:28px}.brand-logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}.brand-name{font-size:20px;font-weight:800}.panel{padding:32px 28px}.panel h2{font-size:17px;font-weight:700;margin-bottom:6px}.panel .sub{font-size:13px;color:var(--text-secondary);margin-bottom:22px}.state{display:none}.state.active{display:block}.icon-hero{text-align:center;margin-bottom:16px}.icon-hero i{font-size:36px;color:var(--accent)}.icon-hero.err i{color:var(--danger)}.back-link{text-align:center;margin-top:20px;font-size:13px}.back-link a{color:var(--text-secondary)}.back-link a:hover{color:var(--text)}</style></head><body><div class="shell"><div class="brand"><div class="brand-logo">D</div><div class="brand-name">D Invites</div></div><div class="card panel"><div class="state active" id="state-checking"><div class="icon-hero"><i class="fa-solid fa-spinner spin"></i></div><h2 style="text-align:center">Verifying your link…</h2></div><div class="state" id="state-form"><h2>Set a new password</h2><p class="sub">Choose something you don't use anywhere else.</p><form id="reset-form" novalidate><div class="field"><label for="new-password">New password</label><div class="input-wrap"><i class="icon-left fa-solid fa-lock"></i><input id="new-password" type="password" placeholder="Min 6 characters" minlength="6" required><i class="icon-right fa-regular fa-eye" data-toggle-password="new-password"></i></div></div><div class="field"><label for="confirm-password">Confirm new password</label><div class="input-wrap"><i class="icon-left fa-solid fa-lock"></i><input id="confirm-password" type="password" placeholder="Re-enter password" minlength="6" required></div></div><button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit">Update password</button><div class="status-msg" id="reset-status"></div></form></div><div class="state" id="state-success"><div class="icon-hero"><i class="fa-regular fa-circle-check"></i></div><h2 style="text-align:center">Password updated</h2><p class="sub" style="text-align:center">Taking you to your dashboard…</p></div><div class="state" id="state-error"><div class="icon-hero err"><i class="fa-regular fa-face-frown"></i></div><h2 style="text-align:center">This link isn't valid</h2><p class="sub" style="text-align:center">It may have expired or already been used. Request a new one from the login page.</p></div></div><p class="back-link"><a href="auth"><i class="fa-solid fa-arrow-left"></i>Back to login</a></p></div><script src="assets/js/global.js"></script><script type="module" src="/assets/js/rp.js"></script></body></html>
